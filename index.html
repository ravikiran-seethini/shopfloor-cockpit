<style>
/* Layout: control-room tool. Dark steel header, tabbed workspace, big tap targets on the operator screen, status colours only for machine state. */
:root{
  --bg:#eef0f1; --surface:#fcfcfb; --sunk:#f3f4f4; --line:#d6dadc; --line-strong:#b9bfc2;
  --ink:#121618; --ink-2:#4c5559; --ink-3:#6f787c;
  --head:#1d2427; --head-ink:#eef1f2; --head-ink-2:#a8b2b6;
  --accent:#1f6fb8; --accent-ink:#ffffff; --accent-soft:#dfeaf6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --bar:#3c4a52; --target:#5a6469;
  --good:#0a7d0a; --good-bg:#dcf1dc; --bad:#c62f2f; --bad-bg:#f8dede; --warn:#9a6300; --warn-bg:#f8ecd2; --plan:#56606a; --plan-bg:#e6e9eb;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-num:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111517; --surface:#1a1f21; --sunk:#151a1c; --line:#2d3538; --line-strong:#3d474b;
  --ink:#eef1f2; --ink-2:#b4bec2; --ink-3:#8c979b;
  --head:#0b0e0f; --head-ink:#eef1f2; --head-ink-2:#8f9a9e;
  --accent:#4a93dd; --accent-ink:#0b0e0f; --accent-soft:#1c2e40;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --bar:#9aa8ae; --target:#a9b4b8;
  --good:#3fc43f; --good-bg:#16301a; --bad:#ef6a6a; --bad-bg:#3a1c1c; --warn:#f0b43c; --warn-bg:#3a2d12; --plan:#a7b1b6; --plan-bg:#262d30;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111517; --surface:#1a1f21; --sunk:#151a1c; --line:#2d3538; --line-strong:#3d474b;
  --ink:#eef1f2; --ink-2:#b4bec2; --ink-3:#8c979b;
  --head:#0b0e0f; --head-ink:#eef1f2; --head-ink-2:#8f9a9e;
  --accent:#4a93dd; --accent-ink:#0b0e0f; --accent-soft:#1c2e40;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --bar:#9aa8ae; --target:#a9b4b8;
  --good:#3fc43f; --good-bg:#16301a; --bad:#ef6a6a; --bad-bg:#3a1c1c; --warn:#f0b43c; --warn-bg:#3a2d12; --plan:#a7b1b6; --plan-bg:#262d30;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .small{font-size:.82rem}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{background:var(--head);color:var(--head-ink);padding-inline:16px;padding-block:10px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 220px}
.logo{width:30px;height:30px;border-radius:6px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:18px;height:18px}
.brand b{font-size:1rem;letter-spacing:.02em;display:block}
.brand span{font-size:.78rem;color:var(--head-ink-2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;border:1px solid #4a565b;border-radius:6px;overflow:hidden}
.lang button{background:none;border:0;color:var(--head-ink-2);padding:5px 10px;cursor:pointer;font-size:.82rem;font-weight:700}
.lang button[aria-pressed="true"]{background:var(--head-ink);color:var(--head)}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding-inline:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:4;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 12px 9px;cursor:pointer;color:var(--ink-2);font-weight:600;white-space:nowrap;font-size:.9rem}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .dot{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:.7rem;line-height:18px;margin-left:5px;text-align:center}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--ink-2);min-width:0}
input,select,textarea{background:var(--sunk);border:1px solid var(--line-strong);border-radius:7px;padding:8px 10px;width:100%;font-size:.95rem;font-weight:400;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--surface);border:0;border-right:1px solid var(--line);padding:7px 12px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--ink-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.plan{background:var(--plan-bg);color:var(--plan)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.swatch{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:.88rem}
.empty{color:var(--ink-3);font-size:.9rem;padding:8px 0}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right}
.tw{overflow-x:auto}

/* operator */
.mchips{display:flex;gap:8px;flex-wrap:wrap}
.mchip{border:2px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left;min-width:120px;display:flex;flex-direction:column;gap:2px}
.mchip b{font-size:.95rem} .mchip span{font-size:.75rem;font-weight:700}
.mchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.status{border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:6px;border:2px solid}
.status.run{background:var(--good-bg);border-color:var(--good)} .status.stop{background:var(--bad-bg);border-color:var(--bad)} .status.idle{background:var(--plan-bg);border-color:var(--plan)}
.status .big{font-size:1.9rem;font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.status.run .big{color:var(--good)} .status.stop .big{color:var(--bad)} .status.idle .big{color:var(--plan)}
.reasons{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.reasons button{min-height:58px;border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:8px 10px;font-weight:700;cursor:pointer;text-align:left;font-size:.9rem}
.reasons button:hover{border-color:var(--accent)}
.reasons button.planned{border-style:dashed;color:var(--ink-2)}
.reasons button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.unexp{border:2px solid var(--bad);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:700}
.kpi .v{font-size:1.6rem;font-weight:800;font-family:var(--f-num);font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .s{font-size:.78rem;color:var(--ink-2)}
.kpi.hot{border-color:var(--bad)} .kpi.hot .v{color:var(--bad)}
.feed{display:flex;flex-direction:column}
.feed .it{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.88rem;flex-wrap:wrap}
.feed .it:last-child{border-bottom:0}
.feed time{font-family:var(--f-num);color:var(--ink-3);font-size:.8rem;min-width:44px}
.feed .grow{flex:1 1 160px;min-width:0}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.toggle input{width:auto;accent-color:var(--accent);transform:scale(1.25)}

/* charts */
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-2);font-size:11px;font-family:var(--f-ui)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line-strong);stroke-width:1}
.chart .tgt{stroke:var(--target);stroke-width:1.5;stroke-dasharray:5 4}
.hbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:minmax(110px,190px) 1fr auto;gap:10px;align-items:center;font-size:.85rem}
.hb .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .track{height:14px;background:var(--sunk);border-radius:0 4px 4px 0;position:relative;min-width:0}
.hb .fill{height:100%;background:var(--bar);border-radius:0 4px 4px 0}
.hb .val{font-family:var(--f-num);font-size:.8rem;color:var(--ink-2);white-space:nowrap;display:flex;gap:8px;align-items:center}
.prog{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;min-width:70px}
.prog i{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0}

/* qr + overlays */
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.qlabel{border:2px solid var(--ink);border-radius:8px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;color:#111}
.qlabel .q{width:150px;height:150px}
.qlabel .q img,.qlabel .q svg{width:150px;height:150px}
.qlabel b{font-size:1.05rem} .qlabel small{font-size:.7rem;color:#444;word-break:break-all;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(5,8,10,.6);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));z-index:20;overflow:auto}
.sheet{background:var(--surface);border-radius:12px;max-width:520px;width:100%;padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.sheet video{width:100%;border-radius:8px;background:#000;max-height:60vh}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--head);color:var(--head-ink);padding:10px 16px;border-radius:8px;z-index:30;max-width:calc(100% - 32px);font-weight:600;font-size:.9rem}
.confirm{border:1px solid var(--bad);background:var(--bad-bg);border-radius:8px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.diagram svg{width:100%;height:auto;display:block}
.diagram text{font-family:var(--f-ui)}

@media (max-width:560px){ .hb{grid-template-columns:1fr auto} .hb .track{grid-column:1 / -1;order:3} .status .big{font-size:1.5rem} }
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media print{ .top,nav.tabs,.noprint,.toast{display:none!important} body{background:#fff} main{padding:0} .card{border:0;padding:0} .labels{grid-template-columns:repeat(3,1fr)} }
</style>

function pickW(r,w){const tot=Object.values(w).reduce((a,b)=>a+b,0);let x=r()*tot;for(const k in w){x-=w[k];if(x<=0)return k;}return Object.keys(w)[0];}

function seed(lang){
  const r=rng(20261019), now=Date.now(), today=dayStart(now);
  const de=lang!=='en';
  const machines=[{id:'P1',name:de?'Presse 1 · 7 Zoll':'Press 1 · 7 inch',rate:60},{id:'P2',name:de?'Presse 2 · 8 Zoll':'Press 2 · 8 inch',rate:48},{id:'P3',name:de?'Presse 3 · 10 Zoll':'Press 3 · 10 inch',rate:30}];
  const O=(no,mat,qty,m,dd)=>({no,material:mat,qty,machine:m,due:ymd(today+dd*DAY),status:'planned'});
  const orders=[
   O('1000412','EN AW-6060 T66 · Rechteckrohr 40×20×2',1600,'P1',-5),O('1000418','EN AW-6063 T5 · Fensterprofil F-210',2200,'P1',-1),O('1000425','EN AW-6060 T66 · L-Profil 30×30×3',2600,'P1',4),O('1000431','EN AW-6063 T5 · Rundrohr Ø25×1,5',2000,'P1',9),
   O('1000414','EN AW-6082 T6 · Kühlkörper KK-85',1300,'P2',-4),O('1000420','EN AW-6005A T6 · Solarprofil SP-12',2100,'P2',-1),O('1000427','EN AW-6060 T66 · Fassadenprofil FP-60',1800,'P2',6),O('1000433','EN AW-6082 T6 · Rahmenprofil RP-40',1500,'P2',11),
   O('1000416','EN AW-6082 T6 · Strukturprofil SP-120',650,'P3',-3),O('1000422','EN AW-6061 T6 · Crashbox-Profil CB-90',850,'P3',1),O('1000429','EN AW-6082 T6 · Batteriewannenprofil BW-200',700,'P3',7),O('1000435','EN AW-6005A T6 · Schienenprofil SR-50',800,'P3',12)];
  const weights={P1:{die_change:8,billet:3,puller:2,quench:2,no_mat:2,qhold:2,saw:1,die_fail:1},P2:{die_change:4,billet:3,puller:6,quench:2,no_mat:2,qhold:1,saw:2,die_fail:1},P3:{die_change:4,billet:2,puller:1,quench:4,no_mat:1,qhold:3,saw:1,die_fail:3}};
  const scrapW={P1:{surface:4,dim:2,seam:1,blister:1,twist:1,ends:4},P2:{surface:3,dim:3,seam:1,blister:2,twist:2,ends:3},P3:{surface:2,dim:2,seam:6,blister:2,twist:3,ends:3}};
  const stops=[],counts=[],notes=[];
  const prog={};orders.forEach(o=>prog[o.no]=0);
  const queue={P1:orders.filter(o=>o.machine==='P1'),P2:orders.filter(o=>o.machine==='P2'),P3:orders.filter(o=>o.machine==='P3')};
  const cur={P1:0,P2:0,P3:0};
  const curShift=shiftAt(now);
  const maintDay={P1:today-5*DAY,P2:today-3*DAY,P3:today-6*DAY};
  for(let d=today-9*DAY; d<=today; d=dayStart(d+30*HOUR)){
    if(!isWorkday(d))continue;
    for(const S of SHIFTS){
      const [s,e]=shiftWindow(d,S.id);
      if(e>curShift.win[0]||e>now)continue; // only completed shifts
      for(const m of machines){
        const ms=[];
        const busy=(a,b)=>ms.some(x=>a<x.end+5*MIN&&b>x.start-5*MIN);
        const add=(reason,a,b,src)=>{ms.push({id:uid(),m:m.id,start:a,end:b,reason,src:src||'BDE'});};
        add('break',s+4*HOUR,s+4*HOUR+30*MIN);
        if(dayStart(maintDay[m.id])===dayStart(d)&&S.id==='F'){add('maint',s+HOUR,s+HOUR+75*MIN);}
        const k=2+Math.floor(r()*3)+(m.id==='P3'?1:0);
        for(let i=0;i<k;i++){
          const rid=pickW(r,weights[m.id]);const R=STOP_REASONS.find(x=>x.id===rid);
          const len=(R.d[0]+r()*(R.d[1]-R.d[0]))*MIN;
          for(let tries=0;tries<12;tries++){const a=s+15*MIN+r()*(8*HOUR-len-30*MIN);const st=Math.round(a/MIN)*MIN,en=st+Math.round(len/MIN)*MIN;if(!busy(st,en)){add(rid,st,en,'MDE');break;}}
        }
        // counts per hour
        const perf=0.84+r()*0.11;
        const scrapRate=m.id==='P3'?0.035+r()*0.025:0.012+r()*0.022;
        let acc=0,shiftPcs=0;
        for(let h=0;h<8;h++){
          const a=s+h*HOUR,b=a+HOUR;
          const down=ms.reduce((t0,x)=>t0+overlap(x.start,x.end,a,b),0);
          acc+=(HOUR-down)/HOUR*m.rate*perf;
          const q=Math.floor(acc);acc-=q;
          const o=queue[m.id][cur[m.id]];
          if(q>0&&o){counts.push({id:uid(),m:m.id,order:o.no,ts:b-MIN,qty:q,scrap:0,reason:null,src:'MDE'});shiftPcs+=q;prog[o.no]+=q*(1-scrapRate);
            if(prog[o.no]>=o.qty){o.status='done';if(cur[m.id]<queue[m.id].length-1)cur[m.id]++;}}
          ms.forEach(x=>{if(x.start>=a&&x.start<b&&!x.order)x.order=(queue[m.id][cur[m.id]]||{}).no||null;});
        }
        let scrapTot=Math.round(shiftPcs*scrapRate);
        const parts=1+Math.floor(r()*3);
        for(let p=0;p<parts&&scrapTot>0;p++){const q=p===parts-1?scrapTot:Math.max(1,Math.round(scrapTot*(0.3+r()*0.4)));scrapTot-=q;
          const o=queue[m.id][cur[m.id]];counts.push({id:uid(),m:m.id,order:o?o.no:null,ts:e-(5+p)*MIN,qty:0,scrap:q,reason:pickW(r,scrapW[m.id]),src:'BDE'});}
        stops.push(...ms);
      }
    }
  }
  // current orders running
  const active={};machines.forEach(m=>{const o=queue[m.id][cur[m.id]];if(o){if(o.status!=='done')o.status='running';active[m.id]=o.no;}});
  // one unexplained stop in the most recent completed shift on P2
  const lastStops=stops.filter(x=>x.m==='P2'&&x.reason!=='break'&&x.reason!=='maint').sort((a,b)=>b.start-a.start);
  if(lastStops[0]){lastStops[0].reason=null;lastStops[0].src='MDE';}
  // notes
  const prevShift=shiftAt(curShift.win[0]-HOUR);
  const N=(date,shift,m,text,author)=>notes.push({id:uid(),date:ymd(date),shift,m,text,author,ts:now-2*HOUR,ack:null});
  N(prevShift.date,prevShift.id,'P2',de?'Puller an P2 hat zweimal ausgelöst, Sensor wirkt verschmutzt. Instandhaltung informiert.':'Puller on P2 tripped twice, sensor looks dirty. Maintenance informed.',de?'K. Demir':'K. Demir');
  N(prevShift.date,prevShift.id,'P3',de?'Pressnahtfehler bei BW-200 erhöht – Bolzentemperatur bitte prüfen.':'More weld seam defects on BW-200 – please check billet temperature.','A. Novak');
  const A=(title,m,reason,owner,dd,status)=>({id:uid(),title,m,reason,owner,due:ymd(today+dd*DAY),status,created:now-3*DAY});
  const actions=[
   A(de?'Werkzeugwechsel P1: Rüstzeit mit SMED-Workshop senken':'Die change P1: cut changeover time with a SMED workshop','P1','die_change','M. Weber',5,'prog'),
   A(de?'Puller-Sensor P2 reinigen und Grenzwert prüfen':'Clean puller sensor on P2 and check threshold','P2','puller',de?'Instandhaltung · T. Kaya':'Maintenance · T. Kaya',-1,'open'),
   A(de?'Pressnahtfehler P3: Bolzentemperatur und Pressgeschwindigkeit prüfen':'Weld seam defects P3: check billet temperature and ram speed','P3','qhold','A. Novak',3,'open'),
   A(de?'Bolzenofen: Aufheizplan an Schichtbeginn anpassen':'Billet furnace: adjust heating plan at shift start','P1','billet','R. Schulz',-6,'closed')];
  return {v:1,lang,plant:de?I18N.de.plantDefault:I18N.en.plantDefault,target:65,machines,stopReasons:STOP_REASONS.map(({d,...x})=>x),scrapReasons:SCRAP_REASONS.slice(),orders,active,stops,counts,notes,actions,seededAt:now};
}

/* ================= OEE ================= */
function oeeRaw(mid,a,b){
  const now=Date.now();b=Math.min(b,now);if(b<=a)return null;
  const m=M(mid);let planned=0,unpl=0;
  for(const x of S.stops){if(x.m!==mid)continue;const ov=overlap(x.start,x.end==null?now:x.end,a,b);if(!ov)continue;if(isPlanned(x))planned+=ov;else unpl+=ov;}
  let qty=0,scrap=0,n=0;for(const c of S.counts){if(c.m===mid&&c.ts>=a&&c.ts<b){qty+=c.qty;scrap+=c.scrap;n++;}}
  if(!n&&!planned&&!unpl)return null; // nothing reported for this machine in this window
  const plan=Math.max(0,(b-a)-planned),run=Math.max(0,plan-unpl);
  const ideal=run/HOUR*(m?m.rate:0);
  return {plan,run,unpl,planned,qty,scrap,good:qty-scrap,ideal};
}
function sumRaw(list){const z={plan:0,run:0,unpl:0,planned:0,qty:0,scrap:0,good:0,ideal:0};for(const r of list){if(!r)continue;for(const k in z)z[k]+=r[k];}return z;}
function kpi(z){const A=z.plan?z.run/z.plan:null;const P=z.ideal?Math.min(1,z.qty/z.ideal):null;const Q=z.qty?Math.max(0,z.good/z.qty):null;const O=(A!=null&&P!=null&&Q!=null)?A*P*Q:null;return {A,P,Q,O};}
function shiftsIn(a,b){const out=[];for(let d=dayStart(a)-DAY;d<=b;d=dayStart(d+30*HOUR)){for(const s of SHIFTS){const w=shiftWindow(d,s.id);if(w[1]>a&&w[0]<b&&w[0]<=Date.now())out.push({date:d,id:s.id,win:w});}}return out;}
function activeShift(sh){ // a shift counts if it is a workday shift or has any data
  if(isWorkday(sh.date))return true;
  return S.counts.some(c=>c.ts>=sh.win[0]&&c.ts<sh.win[1])||S.stops.some(x=>x.start<sh.win[1]&&(x.end||Date.now())>sh.win[0]);
}
function rangeWin(){const now=Date.now();if(UI.range==='today'){const cs=shiftAt(now);const a=shiftWindow(dayStart(now),'F')[0];return [Math.min(a,cs.win[0]),now];}return [dayStart(now)-6*DAY,now];}

/* ================= simulator (MDE) ================= */
const SIM={};
function simStart(mid){
  const now=Date.now(),cs=shiftAt(now);
  const last=Math.max(cs.win[0],...S.counts.filter(c=>c.m===mid).map(c=>c.ts),...S.stops.filter(x=>x.m===mid).map(x=>x.end||x.start));
  const os=openStop(mid);
  SIM[mid]={on:true,clock:Math.min(last,now),state:os?'stop':'run',until:0,acc:0,lastFlush:Math.min(last,now)};
  SIM[mid].until=SIM[mid].clock+nextDur(mid,SIM[mid].state,true);
}
function simStop(mid){const s=SIM[mid];if(!s)return;flushCount(mid,s.clock);delete SIM[mid];const os=openStop(mid);if(os&&os.src==='MDE'){os.end=Date.now();}save();}
function nextDur(mid,state,catching){
  const r=Math.random();
  if(catching){return state==='run'?(25+r*70)*MIN:(6+r*28)*MIN;}
  return state==='run'?(45+r*90)*1000:(25+r*45)*1000; // demo pace
}
function flushCount(mid,ts){const s=SIM[mid];if(!s)return;const q=Math.floor(s.acc);if(q>0){s.acc-=q;S.counts.push({id:uid(),m:mid,order:S.active[mid]||null,ts:Math.min(ts,Date.now()),qty:q,scrap:0,reason:null,src:'MDE'});}s.lastFlush=ts;}
function simTick(){
  const now=Date.now();let changed=false;
  for(const mid in SIM){const s=SIM[mid];if(!s.on)continue;const m=M(mid);if(!m){delete SIM[mid];continue;}
    let budget=24;
    while(budget-->0){
      const catching=s.clock<now-3000;
      const step=catching?5*MIN:Math.max(0,now-s.clock);
      if(step<=0)break;
      const end=Math.min(s.clock+step,s.until,now);
      const dt=end-s.clock;
      if(s.state==='run'&&!S.active[mid]){/* no order: still runs, counts unassigned */}
      if(s.state==='run'){s.acc+=dt/HOUR*m.rate*(0.88+Math.random()*0.08);}
      s.clock=end;changed=true;
      if(s.clock-s.lastFlush>=(catching?30*MIN:20000))flushCount(mid,s.clock);
      if(s.clock>=s.until){
        if(s.state==='run'){flushCount(mid,s.clock);S.stops.push({id:uid(),m:mid,start:s.clock,end:null,reason:null,src:'MDE',order:S.active[mid]||null});s.state='stop';}
        else{const os=openStop(mid);if(os)os.end=s.clock;s.state='run';}
        s.until=s.clock+nextDur(mid,s.state,s.clock<now-3000);
      }
      if(s.clock>=now)break;
    }
    s.catching=s.clock<now-3000;
  }
  if(changed){save();if(UI.tab==='op'||UI.tab==='dash')softRender();}
}

function tables(){
  const mName=id=>(M(id)||{}).name||id;
  const iso=ts=>ts==null?'':new Date(ts).toISOString();
  const loc=ts=>ts==null?'':ymd(ts)+' '+hm(ts);
  const Maschinen=S.machines.map(m=>({Maschine:m.id,Name:m.name,Soll_Stk_h:m.rate}));
  const Stillstaende=S.stops.slice().sort((a,b)=>a.start-b.start).map(x=>({Maschine:x.m,Auftrag:x.order||'',Start:loc(x.start),Ende:loc(x.end),Dauer_min:mins((x.end||Date.now())-x.start),Grund:x.reason?lbl(R(x.reason)):'',Geplant:isPlanned(x)?'ja':'nein',Quelle:x.src,Schicht:shiftAt(x.start).id,Datum:ymd(shiftAt(x.start).date),Start_ISO:iso(x.start)}));
  const Mengen=S.counts.slice().sort((a,b)=>a.ts-b.ts).map(c=>({Maschine:c.m,Auftrag:c.order||'',Zeit:loc(c.ts),Menge:c.qty,Ausschuss:c.scrap,Gutmenge:c.qty-c.scrap,Ausschussgrund:c.reason?lbl(SR(c.reason)):'',Quelle:c.src,Schicht:shiftAt(c.ts).id,Datum:ymd(shiftAt(c.ts).date)}));
  const OEE_Schicht=[];
  const first=Math.min(...S.counts.map(c=>c.ts),...S.stops.map(x=>x.start),Date.now());
  shiftsIn(first,Date.now()).filter(activeShift).forEach(sh=>S.machines.forEach(m=>{const z=oeeRaw(m.id,sh.win[0],sh.win[1]);if(!z)return;const k=kpi(z);OEE_Schicht.push({Datum:ymd(sh.date),Schicht:sh.id,Maschine:m.id,Planzeit_min:mins(z.plan),Laufzeit_min:mins(z.run),Stillstand_ungeplant_min:mins(z.unpl),Menge:z.qty,Gutmenge:z.good,Ausschuss:z.scrap,Sollmenge:Math.round(z.ideal),Verfuegbarkeit:k.A==null?'':+k.A.toFixed(4),Leistung:k.P==null?'':+k.P.toFixed(4),Qualitaet:k.Q==null?'':+k.Q.toFixed(4),OEE:k.O==null?'':+k.O.toFixed(4)});}));
  const Rueckmeldung=S.orders.map(o=>{const st=orderStats(o.no);return {Auftrag:o.no,Material:o.material,Maschine:o.machine||'',Sollmenge:o.qty,Gutmenge:Math.round(st.good),Ausschuss:st.scrap,Stillstand_min:mins(st.down),Erfuellung_Prozent:o.qty?Math.round(st.good/o.qty*1000)/10:'',Status:orderStatus(o)[1],Erste_Buchung:loc(st.first),Letzte_Buchung:loc(st.last),Termin:o.due||''};});
  const Auftraege=S.orders.map(o=>({Auftrag:o.no,Material:o.material,Menge:o.qty,Maschine:o.machine||'',Termin:o.due||''}));
  const Massnahmen=S.actions.map(a=>({Titel:a.title,Maschine:a.m||'',Grund:a.reason&&R(a.reason)?lbl(R(a.reason)):'',Verantwortlich:a.owner||'',Termin:a.due||'',Status:a.status}));
  return {Maschinen,Auftraege,Stillstaende,Mengen,OEE_Schicht,Rueckmeldung,Massnahmen};
}

    <div class="row" style="align-items:flex-end"><label class="f" style="flex:1 1 180px">${esc(t('name'))}<input id="r-new"></label><label class="toggle small"><input type="checkbox" id="r-planned"> ${esc(t('plannedFlag'))}</label><button class="btn sm" data-act="addReason">${esc(t('addReason'))}</button></div></section>
   <section class="card"><h2>${esc(t('scrapReasons'))}</h2><div class="row">${S.scrapReasons.map(r=>`<span class="pill warn">${esc(lbl(r))}</span>`).join('')}</div>
    <div class="row" style="align-items:flex-end"><label class="f" style="flex:1 1 180px">${esc(t('name'))}<input id="sr-new"></label><button class="btn sm" data-act="addScrapReason">${esc(t('addReason'))}</button></div></section>
  </div>
  <section class="card"><div class="card-head"><h2>${esc(t('labels'))}</h2>${inFrame?'':`<button class="btn sm noprint" data-act="print">${esc(t('print'))}</button>`}</div><p class="small muted">${esc(t('labelsHint'))}</p>
   <div class="labels">${S.machines.map(m=>`<div class="qlabel"><div class="q" data-qr="${esc(appUrl(m.id))}"></div><b>${esc(m.id)} · ${esc(m.name)}</b><small>${esc(appUrl(m.id))}</small></div>`).join('')}</div></section>
  <section class="card noprint"><h2>${esc(t('demo'))}</h2>
   ${UI.confirm?`<div class="confirm"><span>${esc(t('sure'))}</span><button class="btn sm danger" data-act="confirmYes">${esc(t('yes'))}</button><button class="btn sm" data-act="confirmNo">${esc(t('no'))}</button></div>`:''}
   <div class="row"><button class="btn" data-act="askReset">${esc(t('resetDemo'))}</button><button class="btn danger" data-act="askClear">${esc(t('clearAll'))}</button></div></section>`;

/* ================= actions / events ================= */
function csvOf(rows){if(!rows.length)return '';const h=Object.keys(rows[0]);const q=v=>{v=v==null?'':String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};return '﻿'+[h.join(';'),...rows.map(r=>h.map(k=>q(r[k])).join(';'))].join('\r\n');}
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9äöüß]+/g,' ').trim();
const COLS={no:['auftrag','fertigungsauftrag','auftragsnummer','order','order no','order number','production order','aufnr'],mat:['materialkurztext','materialbezeichnung','bezeichnung','material description','description','material'],qty:['menge','sollmenge','gesamtmenge','auftragsmenge','qty','quantity','planned qty','order quantity'],m:['maschine','arbeitsplatz','presse','anlage','machine','work center','workcenter','resource'],due:['termin','endtermin','ecktermin ende','liefertermin','due','due date','finish date','end date']};
function importRows(rows){
  if(!rows.length)return 0;
  const keys=Object.keys(rows[0]);const find=c=>{for(const x of COLS[c]){const k=keys.find(k=>norm(k)===x);if(k)return k;}for(const x of COLS[c]){const k=keys.find(k=>norm(k).startsWith(x));if(k)return k;}return null;};
  const kNo=find('no'),kQty=find('qty');if(!kNo||!kQty)return -1;
  const kMat=find('mat'),kM=find('m'),kDue=find('due');let n=0;
  for(const r of rows){const no=String(r[kNo]||'').trim();const qty=Math.round(Number(String(r[kQty]).replace(/\./g,'').replace(',','.'))||Number(r[kQty])||0);if(!no||!qty)continue;
    let due=kDue?r[kDue]:'';if(typeof due==='number')due=ymd(Math.round((due-25569)*DAY)+new Date().getTimezoneOffset()*MIN);else if(due instanceof Date)due=ymd(due.getTime());else if(typeof due==='string'){const m1=due.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);if(m1)due=m1[3]+'-'+pad(m1[2])+'-'+pad(m1[1]);}else due='';
    let mach=kM?String(r[kM]||'').trim():'';if(mach&&!S.machines.some(x=>x.id===mach)){const hit=S.machines.find(x=>norm(x.name).includes(norm(mach))||norm(mach).includes(x.id.toLowerCase()));mach=hit?hit.id:mach;}
    const ex=ORD(no);const o={no,material:kMat?String(r[kMat]||''):'',qty,machine:mach||null,due:due||'',status:ex?ex.status:'planned'};
    if(ex)Object.assign(ex,o);else S.orders.push(o);n++;}
  return n;
}
async function readFile(f){const buf=await f.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{defval:'',raw:true});}

document.addEventListener('click',e=>{
  const lb=e.target.closest('[data-lang]');if(lb){LANG=lb.dataset.lang;S.lang=LANG;save();try{localStorage.setItem(KEY+'-lang',LANG);}catch(x){}render();return;}
  const tb=e.target.closest('[data-tab]');if(tb){UI.tab=tb.dataset.tab;UI.stopFor=null;UI.confirm=null;saveUI();render();window.scrollTo(0,0);return;}
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT'||(b.tagName==='INPUT'&&b.type!=='button'))return;
  const act=b.dataset.act,now=Date.now();
  switch(act){
    case 'pickM':UI.m=b.dataset.m;UI.stopFor=null;saveUI();render();break;
    case 'scan':openScanner();break;
    case 'toggleStopPick':UI.stopFor=UI.stopFor==='new'?null:'new';render();break;
    case 'beginStop':{const os=openStop(UI.m);if(!os)S.stops.push({id:uid(),m:UI.m,start:now,end:null,reason:b.dataset.r,src:'BDE',order:S.active[UI.m]||null});UI.stopFor=null;save();toast(t('booked'));render();break;}
    case 'endStop':{const os=openStop(UI.m);if(os)os.end=now;save();render();break;}
    case 'setReasonOpen':case 'assign':{const x=S.stops.find(s=>s.id===b.dataset.id);if(x){x.reason=b.dataset.r;if(act==='assign')UI.stopFor=null;save();toast(t('booked'));render();}break;}
    case 'assignOpen':UI.stopFor=UI.stopFor===b.dataset.id?null:b.dataset.id;render();break;
    case 'delStop':S.stops=S.stops.filter(x=>x.id!==b.dataset.id);save();render();break;
    case 'delCount':S.counts=S.counts.filter(x=>x.id!==b.dataset.id);save();render();break;
    case 'bookQty':{const g=Math.max(0,Math.round(+($('#q-good')||{}).value||0)),sc=Math.max(0,Math.round(+$('#q-scrap').value||0));if(!g&&!sc){toast('0');break;}
      S.counts.push({id:uid(),m:UI.m,order:S.active[UI.m]||null,ts:now,qty:g+sc,scrap:sc,reason:sc?$('#q-reason').value:null,src:'BDE'});
      // when the machine counter (MDE) counts pieces, a scrap report must not add pieces again
      if(SIM[UI.m]){S.counts[S.counts.length-1].qty=0;}
      const o=ORD(S.active[UI.m]);if(o&&orderStats(o.no).good>=o.qty){o.status='done';}
      save();toast(t('booked'));render();break;}
    case 'range':UI.range=b.dataset.v;saveUI();render();break;
    case 'dm':UI.dm=b.dataset.v;saveUI();render();break;
    case 'prefillAct':{const mid=UI.dm==='all'?(()=>{const by={};S.stops.filter(x=>x.reason===b.dataset.r).forEach(x=>by[x.m]=(by[x.m]||0)+((x.end||now)-x.start));return Object.entries(by).sort((p,q)=>q[1]-p[1])[0]?.[0]||'';})():UI.dm;
      UI.actPrefill={r:b.dataset.r,m:mid,title:t('actPrefill',{r:lbl(R(b.dataset.r)),m:mid||t('all')})};UI.tab='act';saveUI();render();window.scrollTo(0,0);break;}
    case 'shShift':UI.shShift=b.dataset.v;render();break;
    case 'shM':UI.shM=b.dataset.v;render();break;
    case 'print':window.print();break;
    case 'saveNote':{const tx=$('#note-text').value.trim();if(!tx)break;S.notes.push({id:uid(),date:UI.shDate,shift:UI.shShift,m:UI.shM==='all'?null:UI.shM,text:tx,author:$('#note-author').value.trim()||'–',ts:now,ack:null});save();toast(t('noteSaved'));render();break;}
    case 'ack':{const n=S.notes.find(x=>x.id===b.dataset.id);const by=($('#ack-'+b.dataset.id)||{}).value||'';if(n&&by.trim()){n.ack={by:by.trim(),ts:now};save();render();}break;}
    case 'addAct':{const title=$('#a-title').value.trim();if(!title)break;S.actions.push({id:uid(),title,m:$('#a-m').value||null,reason:$('#a-reason').value||null,owner:$('#a-owner').value.trim(),due:$('#a-due').value,status:'open',created:now});UI.actPrefill=null;save();render();break;}
    case 'delAct':S.actions=S.actions.filter(a=>a.id!==b.dataset.id);save();render();break;
    case 'sampleCsv':{const rows=[['Fertigungsauftrag','Material','Materialkurztext','Sollmenge','Arbeitsplatz','Endtermin'],['1000440','AL-6060-T66-RR40','EN AW-6060 T66 · Rechteckrohr 40×20×2','1800','P1',fmtDe(Date.now()+5*DAY)],['1000441','AL-6082-T6-KK85','EN AW-6082 T6 · Kühlkörper KK-85','1200','P2',fmtDe(Date.now()+8*DAY)],['1000442','AL-6082-T6-SP120','EN AW-6082 T6 · Strukturprofil SP-120','600','P3',fmtDe(Date.now()+10*DAY)]];
      download('auftraege_beispiel.csv',new Blob(['﻿'+rows.map(r=>r.join(';')).join('\r\n')],{type:'text/csv'}));break;}
    case 'addOrder':{const no=$('#o-no').value.trim(),qty=Math.round(+$('#o-qty').value||0);if(!no||!qty)break;if(ORD(no))Object.assign(ORD(no),{material:$('#o-mat').value,qty,machine:$('#o-m').value,due:$('#o-due').value});else S.orders.push({no,material:$('#o-mat').value,qty,machine:$('#o-m').value,due:$('#o-due').value,status:'planned'});save();render();break;}
    case 'xlsx':{const T=tables();const wb=XLSX.utils.book_new();for(const k in T)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(T[k].length?T[k]:[{}]),k);const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});download('shopfloor_cockpit_'+stamp()+'.xlsx',new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));break;}
    case 'csv':{const T=tables();download(b.dataset.k+'_'+stamp()+'.csv',new Blob([csvOf(T[b.dataset.k])],{type:'text/csv'}));break;}
    case 'backup':download('shopfloor_cockpit_backup_'+stamp()+'.json',new Blob([JSON.stringify(S)],{type:'application/json'}));break;
    case 'addMachine':{let i=S.machines.length+1;while(M('P'+i))i++;S.machines.push({id:'P'+i,name:(LANG==='de'?'Presse ':'Press ')+i,rate:40});save();render();break;}
    case 'delMachine':{const m=S.machines[+b.dataset.i];if(m){simStop(m.id);S.machines.splice(+b.dataset.i,1);if(UI.m===m.id)UI.m=S.machines[0].id;if(UI.dm===m.id)UI.dm='all';save();render();}break;}
    case 'addReason':{const v=$('#r-new').value.trim();if(!v)break;S.stopReasons.push({id:'r_'+uid(),de:v,en:v,planned:$('#r-planned').checked});save();render();break;}
    case 'addScrapReason':{const v=$('#sr-new').value.trim();if(!v)break;S.scrapReasons.push({id:'s_'+uid(),de:v,en:v});save();render();break;}
    case 'askReset':UI.confirm='reset';render();break;
    case 'askClear':UI.confirm='clear';render();break;
    case 'confirmNo':UI.confirm=null;render();break;
    case 'confirmYes':{for(const k in SIM)delete SIM[k];if(UI.confirm==='reset'){S=seed(LANG);}else{const keep={machines:S.machines,stopReasons:S.stopReasons,scrapReasons:S.scrapReasons,plant:S.plant,target:S.target};S={v:1,lang:LANG,...keep,orders:[],active:{},stops:[],counts:[],notes:[],actions:[],seededAt:Date.now()};}
      UI.confirm=null;UI.m=S.machines[0].id;UI.dm='all';save(true);toast(t('done'));render();break;}
    case 'closeOverlay':closeScanner();break;
    case 'scanPick':closeScanner();UI.m=b.dataset.m;UI.tab='op';saveUI();render();toast(t('scanned',{m:UI.m}));break;
  }
});
const fmtDe=ts=>{const d=new Date(ts);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();};
document.addEventListener('change',async e=>{
  const el=e.target,act=el.dataset&&el.dataset.act;if(!act)return;
  switch(act){
    case 'setOrder':S.active[UI.m]=el.value||undefined;const o=ORD(el.value);if(o&&o.status==='planned')o.status='running';save();render();break;
    case 'sim':if(el.checked){simStart(UI.m);}else simStop(UI.m);render();break;
    case 'shDate':UI.shDate=el.value||UI.shDate;render();break;
    case 'actStatus':{const a=S.actions.find(x=>x.id===el.dataset.id);if(a){a.status=el.value;save();render();}break;}
    case 'setPlant':S.plant=el.value.trim()||S.plant;save();renderTabs();break;
    case 'setTarget':S.target=Math.max(0,Math.min(100,Math.round(+el.value||0)));save();break;
    case 'mName':S.machines[+el.dataset.i].name=el.value.trim()||S.machines[+el.dataset.i].name;save();break;
    case 'mRate':S.machines[+el.dataset.i].rate=Math.max(1,+el.value||1);save();break;
    case 'importFile':{const f=el.files[0];if(!f)break;try{const rows=await readFile(f);const n=importRows(rows);if(n<0)toast(t('importFail'));else{save();toast(t('imported',{n}));render();}}catch(x){toast(t('importFail'));}el.value='';break;}
    case 'restore':{const f=el.files[0];if(!f)break;try{const d=JSON.parse(await f.text());if(d&&d.v&&Array.isArray(d.machines)){for(const k in SIM)delete SIM[k];S=d;LANG=S.lang||LANG;save(true);toast(t('done'));render();}}catch(x){toast('JSON?');}el.value='';break;}
  }
});

/* ================= QR scanner ================= */
let scanStream=null,scanRaf=null;
function closeScanner(){if(scanRaf)cancelAnimationFrame(scanRaf);scanRaf=null;if(scanStream){scanStream.getTracks().forEach(tr=>tr.stop());scanStream=null;}const ov=$('#overlay');ov.hidden=true;ov.innerHTML='';}
function scanFallback(msg){$('#overlay').querySelector('.sheet .body').innerHTML=`<p>${esc(msg)}</p><div class="mchips">${S.machines.map(m=>`<button class="mchip" data-act="scanPick" data-m="${m.id}"><b>${esc(m.id)}</b><span class="muted">${esc(m.name)}</span></button>`).join('')}</div>`;}
async function openScanner(){
  const ov=$('#overlay');ov.hidden=false;
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(t('scan'))}"><div class="card-head"><h2>${esc(t('scan'))}</h2><button class="btn sm" data-act="closeOverlay">${esc(t('close'))}</button></div><div class="body"><p class="small muted">${esc(t('scanHint'))}</p><video playsinline muted></video><canvas hidden></canvas></div></div>`;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){scanFallback(t('camFail'));return;}
  try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});}catch(x){scanFallback(t('camFail'));return;}
  const v=ov.querySelector('video'),c=ov.querySelector('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});v.srcObject=scanStream;try{await v.play();}catch(x){}
  const loop=()=>{if(!scanStream)return;if(v.readyState>=2){c.width=v.videoWidth;c.height=v.videoHeight;ctx.drawImage(v,0,0);const img=ctx.getImageData(0,0,c.width,c.height);const code=window.jsQR?jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'}):null;
      if(code&&code.data){let mid=null;try{mid=new URL(code.data).searchParams.get('m');}catch(x){mid=code.data.trim();}if(mid&&M(mid)){closeScanner();UI.m=mid;UI.tab='op';saveUI();render();toast(t('scanned',{m:mid}));return;}}}
    scanRaf=requestAnimationFrame(loop);};
  loop();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#overlay').hidden)closeScanner();});
window.addEventListener('beforeunload',()=>{for(const mid in SIM)flushCount(mid,SIM[mid].clock);save(true);});

render();
// refresh durations every 20 s even without the simulator
setInterval(()=>{if(!Object.keys(SIM).length)softRender();},20000);
try{if('serviceWorker' in navigator&&!inFrame&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
</script>
